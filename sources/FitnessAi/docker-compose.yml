name: fitnessai

services:
  mysql:
    image: mysql:8.4
    container_name: fitnessai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: AiDbContextDb
      MYSQL_USER: DevUser
      MYSQL_PASSWORD: DevPassword123!
    ports:
      - "0.0.0.0:3306:3306"
    volumes:
      - fitnessai-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Core.Api/Dockerfile
    container_name: fitnessai-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__AiDbContext: "host=mysql;Port=3306;Database=AiDbContextDb;User=DevUser;Password=DevPassword123!;"
    ports:
      - "0.0.0.0:8080:8080"

volumes:
  fitnessai-mysql-data:
